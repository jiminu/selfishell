add_newline = true

format = '$directory$git_branch$git_commit$git_state$git_status$character'

right_format = '$status$cmd_duration$jobs$username$hostname$python$nodejs$java$aws$kubernetes'

[directory]
format = '[$path]($style) '
style = 'bold blue'

truncation_length = 2
truncation_symbol = '.../'
truncate_to_repo = false

[git_branch]
format = '[$branch]($style) '
style = 'green'

[git_commit]
format = '[$hash]($style) '
style = 'green'
only_detached = true

[git_state]
style = 'bold yellow'

[git_status]
format = '(($all_status )$ahead_behind)'

modified = '[!${count}](yellow)'
staged = '[+${count}](green)'
untracked = '[?${count}](bright-blue)'
deleted = '[-](red)'
renamed = '[»](green)'
conflicted = '[~${count}](bold bright-red)'
stashed = '[*${count}](bright-black)'

ahead = '[⇡${count}](green) '
behind = '[⇣${count}](red) '
diverged = '[⇡${ahead_count}](bold green)[⇣${behind_count}](bold red) '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

[status]
disabled = false
format = '[✘ $status]($style) '
style = 'bold red'

[cmd_duration]
min_time = 2000
format = '[$duration]($style) '
style = 'bright-black'

[jobs]
style = 'cyan'

[username]
format = '[$user]($style)'
style_user = 'bright-black'
style_root = 'bold red'
show_always = false

[hostname]
ssh_only = true
format = '[@](bright-black)[$hostname]($style) '
style = 'bold yellow'

[aws]
format = '([aws:$profile]($style) )'
style = 'bold yellow'

[kubernetes]
disabled = false
format = '[k8s:$context]($style) '
style = 'bold cyan'
detect_files = [
  'Chart.yaml',
  'helmfile.yaml',
  'helmfile.yml',
  'kustomization.yaml',
  'kustomization.yml',
  'skaffold.yaml',
  'skaffold.yml',
  'Tiltfile',
]
detect_folders = ['k8s', 'kubernetes', 'helm', 'charts']

[[kubernetes.contexts]]
context_pattern = 'arn:aws:eks:[^:]+:[^:]+:cluster/(?P<cluster>[^/]+)'
context_alias = '$cluster'

[python]
format = '[($virtualenv )]($style)'
style = 'yellow'

[nodejs]
format = '[($version )]($style)'
version_format = 'v${major}'
style = 'green'

[java]
format = '[($version )]($style)'
version_format = 'v${major}'
style = 'yellow'
