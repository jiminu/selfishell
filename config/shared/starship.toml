# ~/.config/starship.toml

# Add a blank line between commands
add_newline = true

# Left prompt
format = '$directory$git_branch$git_commit$git_state$git_status$character'

# Right prompt
right_format = '$python$nodejs$java$username$hostname$aws$kubernetes$jobs$cmd_duration$status'


# ─────────────────────────────
# Current directory
# ─────────────────────────────
[directory]
format = '[$path]($style) '
style = 'bold blue'

# Display paths like ~/code/projects/... with limited truncation
truncation_length = 2
truncation_symbol = '.../'
truncate_to_repo = false


# ─────────────────────────────
# Git branch
# ─────────────────────────────
[git_branch]
format = '[$branch]($style) '
style = 'green'


# ─────────────────────────────
# Detached HEAD commit
# ─────────────────────────────
[git_commit]
format = '[$hash]($style) '
style = 'green'
only_detached = true


# ─────────────────────────────
# Git operation state
# Display only during rebase, merge, cherry-pick, etc.
# ─────────────────────────────
[git_state]
style = 'bold yellow'


# ─────────────────────────────
# Git status
# ─────────────────────────────
[git_status]
format = '(($all_status )$ahead_behind)'

# Display counts such as !1
modified = '[!${count}](red)'
staged = '[+${count}](green)'
untracked = '[?${count}](red)'
deleted = '[-](red)'
renamed = '[»](green)'
conflicted = '[~](bold red)'
stashed = '[*](yellow)'

ahead = '[⇡${count}](green) '
behind = '[⇣${count}](red) '
diverged = '[⇡${ahead_count}](bold green)[⇣${behind_count}](bold red) '


# ─────────────────────────────
# Command prompt character
# ─────────────────────────────
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'


# ─────────────────────────────
# Exit code of the previous command
# Hidden when the command succeeds
# ─────────────────────────────
[status]
disabled = false
format = '[✘ $status]($style) '
style = 'bold red'


# ─────────────────────────────
# Duration of long-running commands
# ─────────────────────────────
[cmd_duration]
min_time = 2000
format = '[$duration]($style) '
style = 'bright-black'


# ─────────────────────────────
# Background jobs
# Hidden when there are no jobs in the current shell
# ─────────────────────────────
[jobs]
style = 'cyan'


# ─────────────────────────────
# Remote session
# ─────────────────────────────
[username]
format = '[$user]($style)'
style_user = 'bright-black'
style_root = 'bold red'
show_always = false

[hostname]
ssh_only = true
format = '[@](bright-black)[$hostname]($style) '
style = 'bold yellow'


# ─────────────────────────────
# Cloud environment
# Display the AWS profile and Kubernetes context
# ─────────────────────────────
[aws]
format = '([aws:$profile]($style) )'
style = 'bold yellow'

[kubernetes]
disabled = false
format = '[k8s:$context]($style) '
style = 'bold cyan'
detect_files = [
  'Chart.yaml',
  'helmfile.yaml',
  'helmfile.yml',
  'kustomization.yaml',
  'kustomization.yml',
  'skaffold.yaml',
  'skaffold.yml',
  'Tiltfile',
]
detect_folders = ['k8s', 'kubernetes', 'helm', 'charts']

[[kubernetes.contexts]]
context_pattern = 'arn:aws:eks:[^:]+:[^:]+:cluster/(?P<cluster>[^/]+)'
context_alias = '$cluster'


# ─────────────────────────────
# Project runtime versions
# Display only when related files exist in the current directory
# ─────────────────────────────
[python]
format = '[($virtualenv )]($style)'
style = 'yellow'

[nodejs]
format = '[($version )]($style)'
version_format = 'v${major}'
style = 'green'

[java]
format = '[($version )]($style)'
version_format = 'v${major}'
style = 'yellow'
