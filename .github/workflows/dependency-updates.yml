name: Dependency updates

on:
  schedule:
    - cron: '00 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update:
    name: Check approved dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Update dependency manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-dependencies.sh

      - name: Check dependency changes
        id: changes
        run: |
          unexpected="$(git status --porcelain -- . ':!dependencies.conf' ':!config/shared/zsh/completion.zsh' ':!config/shared/zsh/interactive.zsh' ':!config/shared/mise.toml' ':!config/shared/nvim/lua/config/languages.lua' ':!go.mod' ':!mise.toml')"
          [[ -z "$unexpected" ]] || {
            printf 'Dependency update touched unexpected files:\n%s\n' "$unexpected" >&2
            exit 1
          }
          if git diff --quiet -- dependencies.conf config/shared/zsh/completion.zsh config/shared/zsh/interactive.zsh config/shared/mise.toml config/shared/nvim/lua/config/languages.lua go.mod mise.toml; then
            printf 'All approved dependencies are current.\n'
            printf 'changed=false\n' >>"$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Set up updated Go toolchain
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shell tooling
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh

      - name: Validate updated manifest
        if: steps.changes.outputs.changed == 'true'
        run: SELFISHELL_TEST_GO_CACHE="$(go env GOCACHE)" bash scripts/check.sh

      - name: Create or refresh dependency update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/dependency-updates
        run: |
          # Recheck after verification before committing any files.
          tracked_files=(dependencies.conf config/shared/zsh/completion.zsh config/shared/zsh/interactive.zsh config/shared/mise.toml config/shared/nvim/lua/config/languages.lua go.mod mise.toml)
          git diff --quiet -- "${tracked_files[@]}" && {
            printf 'All approved dependencies are current.\n'
            exit 0
          }
          unexpected="$(git status --porcelain -- . ':!dependencies.conf' ':!config/shared/zsh/completion.zsh' ':!config/shared/zsh/interactive.zsh' ':!config/shared/mise.toml' ':!config/shared/nvim/lua/config/languages.lua' ':!go.mod' ':!mise.toml')"
          [[ -z "$unexpected" ]] || {
            printf 'Dependency update touched unexpected files:\n%s\n' "$unexpected" >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add "${tracked_files[@]}"
          git commit -m 'Update approved dependencies'
          git push --force-with-lease origin "HEAD:$BRANCH"
          open_pr_count="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [[ "$open_pr_count" == "0" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'Update approved dependencies' \
              --body 'Updates approved dependency pins, mise-managed tool versions, default LSP pins, Go toolchain patches, and verified download checksums. Review release notes and CI results before merging. This workflow never merges or releases automatically.'
          else
            printf 'A dependency update PR is already open on %s; nothing to create.\n' "$BRANCH"
          fi
