name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shell tooling (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt

      - name: Run verification suite
        run: SELFISHELL_TEST_GO_CACHE="$(go env GOCACHE)" bash scripts/check.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require release commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'Release tag must point to a commit on main: %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Resolve release version
        id: version
        env:
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          TAG="$PUSHED_TAG"
          version="${TAG#v}"
          source scripts/release-version.sh
          if ! selfishell_version_is_valid "$version"; then
            printf 'Invalid release tag: %s\n' "$TAG" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >>"$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/build-release.sh --version "$VERSION" --output dist

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke exact release (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error

      - name: Smoke exact prebuilt release
        env:
          SELFISHELL_TEST_RELEASE_DIR: ${{ github.workspace }}/dist
          SELFISHELL_TEST_RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf 'Exact release smoke: %s/%s\n' "$(go env GOOS)" "$(go env GOARCH)"
          go test ./tests/integration -run '^TestExactReleaseSmoke$' -count=1

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error

      - name: Verify downloaded artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          test "$(cat VERSION)" = "$VERSION"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          for target in linux-amd64 linux-arm64 macos-amd64 macos-arm64; do
            test -f "selfishell-$VERSION-$target.tar.gz"
          done
          sha256sum -c SHA256SUMS

      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          release_args=()
          [[ "$TAG" != *-* ]] || release_args+=(--prerelease)
          gh release view "$TAG" >/dev/null 2>&1 && {
            printf 'Release already exists: %s\n' "$TAG" >&2
            exit 1
          }
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --title "$TAG" "${release_args[@]}"
