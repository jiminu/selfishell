name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Stable or pre-release version without the v prefix
        required: true
        type: string
      ref:
        description: Commit or ref to release
        required: true
        default: main
        type: string

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  # Resolves the requested ref to one immutable commit SHA before anything
  # else runs, so verify and publish are guaranteed to check out the exact
  # same commit. Without this, each job independently re-resolving
  # `inputs.ref` (which defaults to the mutable branch "main") could let a
  # push land between verify finishing and publish starting, so publish
  # would release a commit that was never verified.
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}
          fetch-depth: 1

      - name: Resolve to a single commit SHA
        id: resolve
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  verify:
    name: Verify release (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install shell tooling (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt

      - name: Run verification suite
        run: bash scripts/check.sh

  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Check out resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Validate release tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ -n "$PUSHED_TAG" ]]; then
            TAG="$PUSHED_TAG"
            version="${TAG#v}"
          else
            version="$REQUESTED_VERSION"
            TAG="v$version"
          fi
          source lib/common.sh
          if ! selfishell_version_is_valid "$version"; then
            printf 'Invalid release tag: %s\n' "$TAG" >&2
            exit 1
          fi
          local_version=$(tr -d '[:space:]' <VERSION)
          if [[ "$version" != "$local_version" ]]; then
            printf 'Version mismatch: tag/input version is %s, but VERSION file has %s\n' "$version" "$local_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >>"$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: bash scripts/build-release.sh --version '${{ steps.version.outputs.version }}' --output dist

      - name: Generate signed build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*

      - name: Smoke test exact release
        env:
          SELFISHELL_BOOTSTRAP_OS: Linux
          SELFISHELL_BOOTSTRAP_ARCH: x86_64
          SELFISHELL_RELEASE_ROOT: file://${{ runner.temp }}/selfishell-releases
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_dir="$RUNNER_TEMP/selfishell-releases/download/v$VERSION"
          mkdir -p "$release_dir"
          cp dist/* "$release_dir/"
          prefix="$RUNNER_TEMP/selfishell-prefix"
          bash install.sh --version "$VERSION" --prefix "$prefix"
          test "$("$prefix/bin/selfishell" version)" = "selfishell $VERSION"

      - name: Create immutable release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 && {
            printf 'Release tag already exists: %s\n' "$TAG" >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "Selfishell ${TAG#v}"
          git push origin "$TAG"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_args=()
          [[ "$TAG" != *-* ]] || release_args+=(--prerelease)
          gh release view "$TAG" >/dev/null 2>&1 && {
            printf 'Release already exists: %s\n' "$TAG" >&2
            exit 1
          }
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --title "$TAG" "${release_args[@]}"

  notify:
    name: Report release automation result
    if: always()
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Create or resolve failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.verify.result == 'success' && needs.publish.result == 'success' && 'success' || 'failure' }}
        run: bash scripts/workflow-failure-issue.sh '[automation] Release failed' "$RESULT" "$RUN_URL"
