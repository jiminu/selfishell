name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Release calls every check for the tagged commit; path filters apply only to
  # ordinary pushes and PRs.
  workflow_call:
    inputs:
      full:
        description: Run every check regardless of changed files.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      ubuntu_container_e2e: ${{ steps.filter.outputs.ubuntu_container_e2e }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' || inputs.full == true }}
        run: |
          if [[ "$FULL_CHECKS" == true ]]; then
            classification=$'runtime=true\nubuntu_container_e2e=true'
          else
            # Use the base revision so a PR cannot change the classifier to skip its own E2E checks.
            classifier_script="$(mktemp)"
            git show "$BASE_SHA:scripts/classify-ci-changes.sh" >"$classifier_script"
            classification="$(bash "$classifier_script" "$BASE_SHA" "$GITHUB_SHA")"
            rm -f "$classifier_script"
          fi
          printf '%s\n' "$classification" >>"$GITHUB_OUTPUT"
          {
            printf '### CI change classification\n\n'
            # Markdown fences are literal output.
            # shellcheck disable=SC2016
            printf '```text\n%s\n```\n' "$classification"
          } >>"$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell checks (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep both platforms unless the classifier explicitly reports no runtime changes.
        os: ${{ fromJSON(needs.changes.outputs.runtime == 'false' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shell tooling (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt

      - name: Run checks
        run: SELFISHELL_TEST_GO_CACHE="$(go env GOCACHE)" bash scripts/check.sh

      - name: Build disposable release artifacts
        run: |
          bash scripts/build-release.sh --version 0.0.0-ci --output "$RUNNER_TEMP/selfishell-release-assets"

      - name: Smoke exact prebuilt release
        env:
          SELFISHELL_TEST_RELEASE_DIR: ${{ runner.temp }}/selfishell-release-assets
          SELFISHELL_TEST_RELEASE_VERSION: 0.0.0-ci
        run: |
          printf 'Exact release smoke: %s/%s\n' "$(go env GOOS)" "$(go env GOARCH)"
          go test ./tests/integration -run '^TestExactReleaseSmoke$' -count=1

  ubuntu-container-e2e:
    name: Ubuntu 24.04 native archive full install E2E
    needs: changes
    if: needs.changes.outputs.ubuntu_container_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    container:
      image: ubuntu:24.04

    steps:
      - name: Install container prerequisites
        run: |
          # Each mirror has failed alone (a security.ubuntu.com 404, Azure refusals), so
          # every file, including those fetched by the apt calls under test, falls back
          # from Azure to archive.ubuntu.com. Retries stay 0: apt 2.8 hung retrying a refused mirror.
          printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' > /etc/apt/mirrors.txt
          echo 'Acquire::Retries "0";' > /etc/apt/apt.conf.d/80-retries
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu/#mirror+file:/etc/apt/mirrors.txt#' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y ca-certificates curl git tar gzip

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run installed native archive full-install consumer
        env:
          SELFISHELL_UBUNTU_FULL_E2E: '1'
        run: go test ./tests/integration -run '^TestNativeUbuntuInstalledArchiveConsumer$' -count=1 -timeout 50m -v

  macos-configuration-e2e:
    name: macOS installed native archive configuration E2E
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run installed native archive configuration consumer
        env:
          SELFISHELL_NATIVE_MACOS_E2E: '1'
        run: go test ./tests/integration -run '^TestNativeMacInstalledArchiveConsumer$' -count=1 -timeout 12m -v

  neovim-developer-e2e:
    name: Pinned Go mise cleanup and Neovim developer E2E
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned mise through Go
        run: |
          export HOME="$RUNNER_TEMP/selfishell-mise-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME"
          go run ./cmd/selfishell-dev "$GITHUB_WORKSPACE" mise-only
          printf 'PINNED_MISE=%s\n' "$HOME/.local/bin/mise" >>"$GITHUB_ENV"

      - name: Verify Go cleanup with pinned mise
        run: PATH="$(dirname "$PINNED_MISE"):$PATH" go test ./internal/selfishell -run '^TestRealMisePruneRetainsCurrentAndProjectNotRollbackOnly$' -count=1 -v

      - name: Run Go Neovim lifecycle consumer
        env:
          SELFISHELL_PINNED_NEOVIM_E2E: '1'
        run: go test ./internal/selfishell -run '^TestPinnedNeovimConsumer$' -count=1 -timeout 20m -v
