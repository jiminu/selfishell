name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      ubuntu_container_e2e: ${{ steps.filter.outputs.ubuntu_container_e2e }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            classification=$'runtime=true\nubuntu_container_e2e=true'
          else
            # Run the classifier as it exists at $BASE_SHA, not the checked-out
            # (possibly PR-modified) copy -- otherwise a PR could edit this
            # script to always report "nothing changed" and suppress its own
            # e2e coverage. $BASE_SHA predates the PR/push, so its content
            # can't have been written by it.
            classifier_script="$(mktemp)"
            git show "$BASE_SHA:scripts/classify-ci-changes.sh" >"$classifier_script"
            classification="$(bash "$classifier_script" "$BASE_SHA" "$GITHUB_SHA")"
            rm -f "$classifier_script"
          fi
          printf '%s\n' "$classification" >>"$GITHUB_OUTPUT"
          {
            printf '### CI change classification\n\n'
            printf '```text\n%s\n```\n' "$classification"
          } >>"$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell checks (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        if: needs.changes.outputs.runtime == 'true' || runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell tooling (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS' && needs.changes.outputs.runtime == 'true'
        run: brew install shellcheck shfmt

      - name: Run checks
        if: needs.changes.outputs.runtime == 'true' || runner.os == 'Linux'
        run: bash scripts/check.sh

  ubuntu-container-e2e:
    name: Ubuntu 24.04 container installation E2E
    needs: changes
    if: needs.changes.outputs.ubuntu_container_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ubuntu:24.04

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run real installation lifecycle
        run: bash scripts/ubuntu-container-e2e.sh

  macos-configuration-e2e:
    name: macOS configuration lifecycle E2E
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run real configuration lifecycle
        run: bash scripts/macos-configuration-e2e.sh

  neovim-developer-e2e:
    name: Pinned Neovim developer E2E
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install pinned mise
        run: |
          SELFISHELL_ROOT="$GITHUB_WORKSPACE"
          export SELFISHELL_ROOT
          source lib/common.sh
          source lib/paths.sh
          source lib/dependencies.sh
          dependency_install mise linux amd64

      - name: Read pinned Neovim toolchain
        run: |
          mise_version() {
            awk -v requested="$1" '
              /^\[/ { in_tools = ($0 == "[tools]"); next }
              in_tools && $1 == requested {
                gsub(/[[:space:]\"]/, "", $3)
                print $3
                exit
              }
            ' common/mise.toml
          }

          neovim_version="$(mise_version neovim)"
          tree_sitter_version="$(mise_version tree-sitter)"
          node_version="$(mise_version node)"
          [[ -n "$neovim_version" && -n "$tree_sitter_version" && -n "$node_version" ]]
          printf 'MISE_E2E_TOOLS=neovim@%s tree-sitter@%s node@%s\n' \
            "$neovim_version" "$tree_sitter_version" "$node_version" >>"$GITHUB_ENV"

      - name: Install pinned Neovim toolchain
        run: ~/.local/bin/mise install $MISE_E2E_TOOLS

      - name: Run Neovim configuration tests
        run: ~/.local/bin/mise exec $MISE_E2E_TOOLS -- bash tests/neovim_config_test.bash

      - name: Run real Neovim lifecycle
        run: ~/.local/bin/mise exec $MISE_E2E_TOOLS -- bash scripts/neovim-e2e.sh
