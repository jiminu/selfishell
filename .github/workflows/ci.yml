name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
      ubuntu_container_e2e: ${{ steps.filter.outputs.ubuntu_container_e2e }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect runtime changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            classification=$'runtime=true\nubuntu_container_e2e=true'
          else
            # Use the base revision so a PR cannot change the classifier to skip its own E2E checks.
            classifier_script="$(mktemp)"
            git show "$BASE_SHA:scripts/classify-ci-changes.sh" >"$classifier_script"
            classification="$(bash "$classifier_script" "$BASE_SHA" "$GITHUB_SHA")"
            rm -f "$classifier_script"
          fi
          printf '%s\n' "$classification" >>"$GITHUB_OUTPUT"
          {
            printf '### CI change classification\n\n'
            printf '```text\n%s\n```\n' "$classification"
          } >>"$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell checks (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep both platforms unless the classifier explicitly reports no runtime changes.
        os: ${{ fromJSON(needs.changes.outputs.runtime == 'false' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Migration reference commits are read offline by the test suite.
          fetch-depth: 0

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install shell tooling (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt zsh

      - name: Install shell tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt

      - name: Run checks
        run: bash scripts/check.sh

  ubuntu-container-e2e:
    name: Ubuntu 24.04 Go full install and legacy archive lifecycle E2E
    needs: changes
    if: needs.changes.outputs.ubuntu_container_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    container:
      image: ubuntu:24.04

    steps:
      - name: Install container prerequisites
        run: |
          # Use the hosted runners' Azure mirror: some security.ubuntu.com backends
          # have served an index before its packages, failing installs with 404.
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu/#http://azure.archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y ca-certificates curl

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run native Go full-install consumer
        env:
          SELFISHELL_UBUNTU_FULL_E2E: '1'
        run: go test ./internal/selfishell -run '^TestUbuntuFullInstallConsumer$' -count=1 -timeout 40m -v

      - name: Run legacy release archive lifecycle (until issue 248)
        run: bash scripts/ubuntu-container-e2e.sh

  macos-configuration-e2e:
    name: macOS Go configuration and legacy archive lifecycle E2E
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run native Go configuration consumer
        env:
          SELFISHELL_NATIVE_MACOS_E2E: '1'
        run: go test ./internal/selfishell -run '^TestNativeMacConfigurationConsumer$' -count=1 -v

      - name: Run legacy release archive lifecycle (until issue 248)
        run: bash scripts/macos-configuration-e2e.sh

  neovim-developer-e2e:
    name: Pinned Go mise cleanup and Neovim developer E2E
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned mise through Go
        run: |
          export HOME="$RUNNER_TEMP/selfishell-mise-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME"
          go run ./cmd/selfishell-dev "$GITHUB_WORKSPACE" mise-only
          printf 'PINNED_MISE=%s\n' "$HOME/.local/bin/mise" >>"$GITHUB_ENV"

      - name: Verify Go cleanup with pinned mise
        run: PATH="$(dirname "$PINNED_MISE"):$PATH" go test ./internal/selfishell -run '^TestRealMisePruneRetainsCurrentAndProjectNotRollbackOnly$' -count=1 -v

      - name: Run Go Neovim lifecycle consumer
        env:
          SELFISHELL_PINNED_NEOVIM_E2E: '1'
        run: go test ./internal/selfishell -run '^TestPinnedNeovimConsumer$' -count=1 -timeout 20m -v
